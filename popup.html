<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Video Blocker</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-wrapper">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            <polygon points="10 8 16 12 10 16 10 8" fill="currentColor" opacity="0.8" />
            <line x1="4" y1="4" x2="20" y2="20" stroke="#ef4444" stroke-width="2.5" />
          </svg>
          <div class="pulse-ring"></div>
        </div>
        <div class="brand-text">
          <h1>Video Blocker</h1>
          <span class="version-tag">v1.1.0</span>
        </div>
      </div>
      
      <!-- Master Switch -->
      <label class="switch master-switch" title="Global Toggle">
        <input type="checkbox" id="master-toggle" checked>
        <span class="slider round"></span>
      </label>
    </header>

    <!-- Master Status Alert -->
    <div id="master-status-bar" class="status-bar active">
      <span class="status-dot"></span>
      <span id="master-status-text">Video Blocker is Active</span>
    </div>

    <!-- Current Tab Quick Action Card -->
    <section class="current-site-card">
      <div class="site-info">
        <div class="site-icon-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="globe-icon">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
        </div>
        <div class="site-details">
          <span class="site-label">Current Website</span>
          <span id="current-hostname" class="site-hostname">Detecting site...</span>
        </div>
      </div>
      <button id="quick-toggle-btn" class="quick-toggle-btn">
        <span id="quick-toggle-text">Block Site</span>
      </button>
    </section>

    <!-- Main Content Tabs / Sections -->
    <main class="main-content">
      <!-- Section: Platforms -->
      <section class="section-container">
        <div class="section-header">
          <h2>Platform Controls</h2>
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="platform-search" placeholder="Search platforms...">
          </div>
        </div>

        <div id="platforms-grid" class="platforms-grid">
          <!-- Dynamically populated by popup.js -->
        </div>
      </section>

      <!-- Section: Custom Domains -->
      <section class="section-container custom-domains-section">
        <div class="section-header">
          <h2>Custom Blocked Websites</h2>
        </div>
        <p class="section-desc">Add specific website domains where videos should be blocked.</p>

        <form id="add-domain-form" class="domain-input-group">
          <input type="text" id="custom-domain-input" placeholder="e.g. news.yahoo.com" autocomplete="off" spellcheck="false">
          <button type="submit" id="add-domain-btn" class="btn-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Add
          </button>
        </form>

        <div id="custom-domains-list" class="domains-chips-container">
          <!-- Dynamically populated by popup.js -->
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <span id="active-summary">Active blocking on 0 sources</span>
      <span class="footer-credit">Selective Mode</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
